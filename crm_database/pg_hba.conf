# PostgreSQL Client Authentication Configuration File
# Enforce password-based authentication for local connections.
# Generated by crm_database setup; do not edit in place—use startup.sh to re-generate if needed.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     md5

# IPv4 local connections:
host    all             all             127.0.0.1/32            md5

# IPv6 local connections:
host    all             all             ::1/128                 md5

# Allow connections from same Docker network (optional; uncomment and scope to your network)
# host    all           all             172.16.0.0/12           md5
